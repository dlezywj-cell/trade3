<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>趋势交易回测终端 - 云同步版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.bootcdn.net/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0a0c10; --panel:#11141b; --panel-alt:#161a23; --border:#232938;
    --text:#e7eaf0; --text-dim:#8a93a8; --amber:#f0b429; --amber-dim:#9a6f10;
    --green:#2bb673; --red:#e5484d; --blue:#4299e1; --purple:#9f7aea; --mono:'IBM Plex Mono', monospace; --display:'Space Grotesk', sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;padding:24px;background:var(--bg);color:var(--text);font-family:var(--mono);max-width:1300px;margin:0 auto;}
  
  header{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--border);padding-bottom:16px;margin-bottom:20px;}
  header h1{font-family:var(--display);font-size:26px;margin:0;letter-spacing:-0.02em;}
  header h1 span{color:var(--amber);}

  .sync-actions{display:flex;gap:8px;}
  .sync-actions button{background:var(--panel-alt);border:1px solid var(--border);color:var(--amber);font-family:var(--display);font-size:12px;padding:5px 12px;border-radius:4px;cursor:pointer;}
  .sync-actions button:hover{background:var(--amber);color:var(--bg);}

  .layout{display:grid;grid-template-columns:360px 1fr;gap:20px;}
  
  @media (max-width:950px){
    .layout{grid-template-columns:1fr;}
    body{padding:15px;}
    header{flex-direction:column; align-items:flex-start; gap:10px;}
    .sync-actions{width:100%; justify-content:space-between;}
  }

  .panel{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:18px;margin-bottom:16px;}
  .panel h2{font-family:var(--display);font-size:13px;text-transform:uppercase;color:var(--text-dim);margin:0 0 14px 0;letter-spacing:0.1em;display:flex;justify-content:space-between;align-items:center;}
  label{display:block;font-size:11px;color:var(--text-dim);margin:12px 0 4px 0;}
  input{width:100%;background:var(--panel-alt);border:1px solid var(--border);color:var(--text);font-family:var(--mono);font-size:13px;padding:8px;border-radius:5px;outline:none;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  button#runBtn{font-family:var(--display);font-weight:700;border:none;border-radius:6px;padding:12px;cursor:pointer;width:100%;margin-top:15px;background:var(--amber);color:#1a1300;font-size:15px;}
  button#runBtn:disabled{opacity:0.4;cursor:not-allowed;}

  .search-group-bar{background:var(--panel-alt);padding:8px;border-radius:6px;margin-bottom:10px;border:1px solid var(--amber-dim);}
  .batch-actions{display:flex; gap:8px; margin-bottom:10px;}
  .btn-mini{background:var(--panel-alt); border:1px solid var(--border); color:var(--text-dim); font-size:10px; padding:4px 8px; border-radius:4px; cursor:pointer;}
  .fav-table-container{max-height: 250px; overflow-y: auto; border:1px solid var(--border); border-radius: 4px; background: #0d1117;}
  .fav-table{width: 100%; border-collapse: collapse; font-size: 11px;}
  .fav-table th, .fav-table td{text-align: left; padding: 8px; border-bottom: 1px solid var(--border); color: var(--text-dim);}
  .fav-table tr.active td{color: var(--amber); background: rgba(240, 180, 41, 0.05);}
  .fav-btn-del{color: var(--red); cursor: pointer; font-size: 14px;}
  .fav-add-bar{display: grid; grid-template-columns: 1fr 1fr auto; gap: 4px; margin-top: 8px;}

  .collapsible-trigger{cursor:pointer;color:var(--amber);font-size:10px;text-transform:none;}
  .collapsible-content{display:none;margin-top:10px;border-top:1px solid var(--border);padding-top:10px;}
  .collapsible-content.show{display:block;}

  #log{background:#05060a;border:1px solid var(--border);height:150px;overflow-y:auto;font-size:11px;padding:10px;line-height:1.6;border-radius:4px;}
  .t-err{color:var(--red);} .t-ok{color:var(--green);} .t-warn{color:var(--amber);}

  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:18px;}
  .stat{background:var(--panel-alt);border:1px solid var(--border);padding:14px;border-radius:7px;}
  .stat .label{font-size:10px;color:var(--text-dim);text-transform:uppercase;margin-bottom:4px;}
  .stat .value{font-family:var(--display);font-size:24px;font-weight:700;}
  .stat .sub{font-size:12px;color:var(--text-dim);margin-top:6px; line-height:1.5;}
  .pos{color:var(--green);} .neg{color:var(--red);}
  .chart-container{height:300px;position:relative;background:var(--panel-alt);border:1px solid var(--border);border-radius:7px;padding:10px;margin-bottom:10px;}
  table{width:100%;border-collapse:collapse;font-size:12px;}
  th,td{padding:8px;text-align:right;border-bottom:1px solid var(--border);}
  th{color:var(--text-dim);font-size:10px;}
  .stockblock{margin-bottom:30px;}
  .stockblock h3{font-family:var(--display);font-size:16px;margin:0 0 10px 0;color:var(--amber);}
  .table-scroll{overflow-x: auto; -webkit-overflow-scrolling: touch;}
</style>
</head>
<body>

<header>
  <h1>趋势<span>交易</span>回测终端</h1>
  <div class="sync-actions">
    <button onclick="CloudSync.fetch()">拉取云端数据</button>
    <button onclick="CloudSync.save()">同步当前列表</button>
  </div>
</header>

<div class="layout">
  <aside>
    <div class="panel">
      <h2>股票管理</h2>
      <div class="search-group-bar">
        <label style="margin-top:0; color:var(--amber)">按标签/名称批量选中</label>
        <input type="text" id="groupSearch" placeholder="输入标签回车" onkeypress="if(event.keyCode==13) FavManager.selectByQuery(this.value)">
      </div>
      <div class="batch-actions">
        <div class="btn-mini" onclick="FavManager.batchSelect(true)">全选</div>
        <div class="btn-mini" onclick="FavManager.batchSelect(false)">全不选</div>
        <div class="btn-mini" onclick="FavManager.inverseSelect()">反选</div>
      </div>
      <div class="fav-table-container">
        <table class="fav-table">
          <thead><tr><th width="30">选</th><th>代码/名称</th><th>标签</th><th width="20"></th></tr></thead>
          <tbody id="favBody"></tbody>
        </table>
      </div>
      <div class="fav-add-bar">
        <input type="text" id="newCode" placeholder="代码/名称">
        <input type="text" id="newTag" placeholder="标签">
        <button id="addFavBtn" class="btn-mini" style="background:var(--amber);color:#000;border:none">添加</button>
      </div>
    </div>

    <div class="panel">
      <h2>回测配置</h2>
      <div class="row2">
        <div><label>开始日期</label><input type="date" id="startDate" value="2026-01-01"></div>
        <div><label>结束日期</label><input type="date" id="endDate" value="2026-06-18"></div>
      </div>
      
      <div>
        <div class="collapsible-trigger" onclick="toggleCollapsible('advParams')">▼ 策略参数 & GitHub 同步</div>
        <div id="advParams" class="collapsible-content">
          <label>GitHub Token (需勾选 gist 权限)</label>
          <input type="password" id="ghToken" placeholder="ghp_xxxx">
          <label>Gist ID (URL末尾那串字符)</label>
          <input type="text" id="ghGistId" placeholder="粘贴 Gist URL 末尾的 ID">
          <hr style="border:0; border-top:1px dashed var(--border); margin:12px 0">
          <label>初始总资金 (CNY)</label>
          <input type="number" id="capital" value="1000000">
          <div class="row2">
            <div><label>底部上涨%激活</label><input type="number" id="riseFromBottom" value="15"></div>
            <div><label>底部回看天数</label><input type="number" id="bottomLookback" value="0"></div>
          </div>
          <div class="row2">
            <div><label>买入:MA线</label><input type="number" id="maBuy" value="10"></div>
            <div><label>卖出:MA线</label><input type="number" id="maSell" value="20"></div>
          </div>
          <div class="row2">
            <div><label>跌破幅度%卖出</label><input type="number" id="sellDropPct" value="5"></div>
            <div><label>单边手续费%</label><input type="number" id="commission" value="0"></div>
          </div>
          <div style="display:flex; align-items:center; gap:8px; margin-top:10px;">
            <input type="checkbox" id="showBenchmark" checked style="width:auto">
            <label style="margin:0">对比基准 (等权持有)</label>
          </div>
        </div>
      </div>
      <button id="runBtn">开始执行回测</button>
      <input type="hidden" id="codes">
    </div>

    <div class="panel">
      <h2>系统日志 <span class="collapsible-trigger" onclick="toggleCollapsible('logBox')">展开/收起</span></h2>
      <div id="logBox" class="collapsible-content">
        <div id="log"></div>
      </div>
    </div>
  </aside>

  <main>
    <div id="resultsArea" style="display:none;">
      <div class="panel">
        <h2>组合核心表现</h2>
        <div class="stats" id="statsRow"></div>
        <div class="chart-container"><canvas id="equityChart"></canvas></div>
      </div>
      <div class="panel">
        <h2>仓位动态分布 (0-100%)</h2>
        <div class="chart-container" style="height: 240px;"><canvas id="weightChart"></canvas></div>
      </div>
      <div class="panel">
        <h2>有效交易明细 (包含未结清)</h2>
        <div class="table-scroll" id="stockDetails"></div>
      </div>
    </div>
  </main>
</div>

<script>
function toggleCollapsible(id) { document.getElementById(id).classList.toggle('show'); }

(function(){
  const logEl = document.getElementById('log');
  function log(msg, level='info'){
    const div = document.createElement('div');
    div.className = 't-' + level;
    div.textContent = `[${new Date().toLocaleTimeString('zh-CN', {hour12:false})}] ${msg}`;
    logEl.appendChild(div);
    logEl.scrollTop = logEl.scrollHeight;
    if(level !== 'info') document.getElementById('logBox').classList.add('show');
  }

  // 手机端友好日期设置
  const now = new Date();
  const dateStr = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
  document.getElementById('endDate').value = dateStr;

  // --- GitHub 云端同步逻辑 ---
  const CloudSync = {
    async save() {
      const token = document.getElementById('ghToken').value;
      const gistId = document.getElementById('ghGistId').value;
      if(!token || !gistId) return alert("请先在高级设置中填写 GitHub Token 和 Gist ID");
      log("云端同步中...");
      try {
        const data = FavManager.get();
        const res = await fetch(`https://api.github.com/gists/${gistId}`, {
          method: 'PATCH',
          headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ files: { "stock_pool_v3.json": { content: JSON.stringify(data) } } })
        });
        if(res.ok) log("数据已成功同步至 GitHub", "ok"); else throw "fail";
      } catch(e) { log("同步失败，请检查配置和网络", "err"); }
    },
    async fetch() {
      const token = document.getElementById('ghToken').value;
      const gistId = document.getElementById('ghGistId').value;
      if(!token || !gistId) return alert("请先在高级设置中填写配置");
      log("拉取数据中...");
      try {
        const res = await fetch(`https://api.github.com/gists/${gistId}`, { headers: { 'Authorization': `token ${token}` } });
        const json = await res.json();
        const content = JSON.parse(json.files["stock_pool_v3.json"].content);
        FavManager.save(content);
        log("云端拉取并同步本地成功", "ok");
      } catch(e) { log("拉取失败", "err"); }
    }
  };
  window.CloudSync = CloudSync;

  // --- 股票管理 ---
  const FavManager = {
    key: 'BT_FAV_PRO_V3',
    default: [{code:'600519', name:'贵州茅台', tag:'白酒', selected:true},{code:'300750', name:'宁德时代', tag:'新能源', selected:true}],
    get() { const d = localStorage.getItem(this.key); return d ? JSON.parse(d) : this.default; },
    save(list) { localStorage.setItem(this.key, JSON.stringify(list)); this.render(); },
    render() {
      const list = this.get();
      document.getElementById('favBody').innerHTML = list.map((item, index) => `
        <tr class="${item.selected ? 'active' : ''}">
          <td><input type="checkbox" ${item.selected ? 'checked' : ''} onchange="FavManager.toggle(${index})"></td>
          <td>${item.name}<br><small>${item.code}</small></td>
          <td><input type="text" class="fav-input-tag" style="background:transparent;border:1px solid transparent;color:inherit;width:100%" value="${item.tag || ''}" onchange="FavManager.updateTag(${index}, this.value)"></td>
          <td><span class="fav-btn-del" onclick="FavManager.remove(${index})">×</span></td>
        </tr>
      `).join('');
    },
    batchSelect(s) { const list = this.get(); list.forEach(i => i.selected = s); this.save(list); },
    inverseSelect() { const list = this.get(); list.forEach(i => i.selected = !i.selected); this.save(list); },
    selectByQuery(q) { if(!q) return; const list = this.get(); list.forEach(i => { if((i.tag||"").includes(q) || i.name.includes(q)) i.selected = true; }); this.save(list); document.getElementById('groupSearch').value = ''; },
    toggle(idx) { const list = this.get(); list[idx].selected = !list[idx].selected; this.save(list); },
    remove(idx) { const list = this.get(); list.splice(idx,1); this.save(list); },
    updateTag(idx, v) { const list = this.get(); list[idx].tag = v; localStorage.setItem(this.key, JSON.stringify(list)); },
    async add(q, t) {
      try {
        const res = await resolveStockInfo(q);
        const list = this.get();
        list.push({ code: res.code, name: res.name, tag: t || '未分类', selected: true });
        this.save(list);
      } catch(e) { log("未识别到该股票", "err"); }
    }
  };
  window.FavManager = FavManager;

  // 使用 JSONP 处理股票搜索以解决手机跨域
  async function resolveStockInfo(query) {
    return new Promise((resolve, reject) => {
      const cb = 'search_' + Math.random().toString(36).slice(2);
      const s = document.createElement('script');
      s.src = `https://searchapi.eastmoney.com/api/suggest/get?input=${encodeURIComponent(query)}&type=14&cb=${cb}`;
      window[cb] = (d) => {
        if(d?.QuotationCodeTable?.Data?.length > 0) {
          const r = d.QuotationCodeTable.Data[0];
          resolve({ code: r.Code, name: r.Name });
        } else reject();
        delete window[cb]; s.remove();
      };
      document.body.appendChild(s);
    });
  }

  document.getElementById('addFavBtn').onclick = () => {
    FavManager.add(document.getElementById('newCode').value, document.getElementById('newTag').value);
    document.getElementById('newCode').value = ''; document.getElementById('newTag').value = '';
  };

  // --- 回测核心计算 ---
  const MathUtil = {
    sma(v, n) {
      let r = new Array(v.length).fill(null), sum = 0;
      for (let i = 0; i < v.length; i++) {
        sum += v[i]; if (i >= n) sum -= v[i - n];
        if (i >= n - 1) r[i] = sum / n;
      }
      return r;
    },
    rollingMin(v, n) {
      let r = new Array(v.length).fill(null);
      for (let i = 0; i < v.length; i++) {
        let start = (n === 0) ? 0 : Math.max(0, i - n + 1);
        let m = v[i];
        for (let j = start; j < i; j++) if(v[j] < m) m = v[j];
        r[i] = m;
      }
      return r;
    },
    maxDD(eq) {
      let peak = -Infinity, mdd = 0;
      for (const v of eq) { if (v > peak) peak = v; let dd = (v / peak) - 1; if (dd < mdd) mdd = dd; }
      return mdd;
    }
  };

  // 手机端核心优化：使用 JSONP 获取 K 线数据，彻底解决移动端 fetch 跨域拦截问题
  async function fetchKline(code, beg, end){
    return new Promise((resolve, reject) => {
      let pre = /^(60|68|90)/.test(code) ? '1.' : '0.';
      const cb = 'kline_' + Math.random().toString(36).slice(2);
      const s = document.createElement('script');
      s.src = `https://push2his.eastmoney.com/api/qt/stock/kline/get?secid=${pre}${code}&fields1=f1,f2&fields2=f51,f52,f53,f54&klt=101&fqt=1&beg=${beg}&end=${end}&cb=${cb}`;
      window[cb] = (j) => {
        if(j?.data?.klines && j.data.klines.length > 0) {
          resolve({ dates: j.data.klines.map(x=>x.split(',')[0]), closes: j.data.klines.map(x=>parseFloat(x.split(',')[2])) });
        } else {
          reject(new Error("数据为空"));
        }
        delete window[cb]; s.remove();
      };
      s.onerror = () => reject(new Error("API请求失败"));
      document.body.appendChild(s);
      setTimeout(() => { if(window[cb]) reject(new Error("请求超时")); }, 8000);
    });
  }

  let chartEq = null, chartWt = null;
  const COLORS = ['#2bb673', '#e5484d', '#4299e1', '#9f7aea', '#ed64a6', '#ecc94b', '#4fd1c5'];

  document.getElementById('runBtn').onclick = async function(){
    const btn = this; btn.disabled = true;
    logEl.innerHTML = ''; log("启动回测引擎...");
    try {
      const selected = FavManager.get().filter(i => i.selected);
      if(!selected.length) throw new Error("请先在列表中勾选股票");
      const beg = document.getElementById('startDate').value.replace(/-/g,'');
      const end = document.getElementById('endDate').value.replace(/-/g,'');
      const cap = parseFloat(document.getElementById('capital').value);
      const conf = {
        mb: parseInt(document.getElementById('maBuy').value),
        ms: parseInt(document.getElementById('maSell').value),
        rise: parseInt(document.getElementById('riseFromBottom').value)/100,
        look: parseInt(document.getElementById('bottomLookback').value),
        drop: parseInt(document.getElementById('sellDropPct').value)/100,
        comm: parseFloat(document.getElementById('commission').value)/100
      };

      const stocks = [];
      for(const s of selected) { 
        try { 
          const kdata = await fetchKline(s.code, beg, end);
          stocks.push({ code: s.code, name: s.name, ...kdata }); 
        } catch(e){ log(`${s.name} 数据抓取失败或范围内无数据`, "warn"); } 
      }
      
      if(stocks.length === 0) throw new Error("所选日期范围内无可用行情数据");

      const results = stocks.map(ds => {
        const maB = MathUtil.sma(ds.closes, conf.mb), maS = MathUtil.sma(ds.closes, conf.ms);
        const mins = MathUtil.rollingMin(ds.closes, conf.look);
        const sigs = new Array(ds.dates.length).fill(false);
        const trades = []; let hold = false, bIdx = -1;
        for(let i=0; i<ds.closes.length; i++){
          const pr = ds.closes[i];
          if(!hold){ if(maB[i] && pr > maB[i] && pr >= mins[i]*(1+conf.rise)) { hold=true; bIdx=i; } }
          else { if(maS[i] && pr < maS[i]*(1-conf.drop)) { hold=false; trades.push({bd:ds.dates[bIdx], bp:ds.closes[bIdx], sd:ds.dates[i], sp:pr, status:'已结清'}); } }
          sigs[i] = hold;
        }
        if(hold) trades.push({bd:ds.dates[bIdx], bp:ds.closes[bIdx], sd:ds.dates[ds.dates.length-1], sp:ds.closes[ds.dates.length-1], status:'持仓中'});
        return { ...ds, sigs, trades };
      });

      const dates = results[0].dates;
      let curEq = cap, strategyLine = [], benchmarkLine = [], weights = results.map(()=>[]), prevIdx = [];
      for(let i=0; i<dates.length; i++){
        let curIdx = []; results.forEach((s, idx) => { if(s.sigs[i]) curIdx.push(idx); });
        if(i > 0 && prevIdx.length > 0) {
          let dailyRet = 0; prevIdx.forEach(idx => dailyRet += (results[idx].closes[i]/results[idx].closes[i-1])-1);
          curEq *= (1 + dailyRet / prevIdx.length);
        }
        if(JSON.stringify(curIdx) !== JSON.stringify(prevIdx)) curEq *= (1 - conf.comm);
        strategyLine.push(curEq);
        const wPer = curIdx.length ? 100/curIdx.length : 0;
        results.forEach((s,idx) => weights[idx].push(curIdx.includes(idx)?wPer:0));
        prevIdx = curIdx;
        benchmarkLine.push(results.reduce((sum, s) => sum + ((cap/results.length)/s.closes[0]) * (s.closes[i] || s.closes[0]), 0));
      }

      document.getElementById('resultsArea').style.display = 'block';
      const sRet = (curEq/cap-1)*100, sMDD = MathUtil.maxDD(strategyLine)*100;
      const bRet = (benchmarkLine[benchmarkLine.length-1]/cap-1)*100, bMDD = MathUtil.maxDD(benchmarkLine)*100;
      
      // 彻底修正：此处原本误写为 bDD，现统一为 bMDD
      document.getElementById('statsRow').innerHTML = `
        <div class="stat"><div class="label">策略组合表现</div><div class="value ${sRet>=0?'pos':'neg'}">${sRet.toFixed(2)}%</div><div class="sub">回撤: <span class="neg">${sMDD.toFixed(2)}%</span></div></div>
        <div class="stat"><div class="label">基准对照表现</div><div class="value ${bRet>=0?'pos':'neg'}">${bRet.toFixed(2)}%</div><div class="sub">回撤: <span class="neg">${bMDD.toFixed(2)}%</span></div></div>
      `;

      if(chartEq) chartEq.destroy();
      chartEq = new Chart(document.getElementById('equityChart'), {
        type:'line', data:{labels:dates, datasets:[
          {label:'策略组合', data:strategyLine, borderColor:'#f0b429', borderWidth:2, pointRadius:0},
          {label:'基准持有', data:benchmarkLine, borderColor:'#8a93a8', borderDash:[5,5], pointRadius:0, hidden:!document.getElementById('showBenchmark').checked}
        ]},
        options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},scales:{x:{grid:{color:'#232938'},ticks:{color:'#8a93a8',maxTicksLimit:8}},y:{grid:{color:'#232938'},ticks:{color:'#8a93a8'}}}}
      });

      if(chartWt) chartWt.destroy();
      chartWt = new Chart(document.getElementById('weightChart'), {
        type:'line', data:{labels:dates, datasets:results.map((s,idx)=>({label:s.name,data:weights[idx],fill:true,pointRadius:0,borderWidth:1,backgroundColor:COLORS[idx%COLORS.length]+'88',borderColor:COLORS[idx%COLORS.length],stack:'s'}))},
        options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{display:false}},scales:{y:{stacked:true,max:100,grid:{color:'#232938'},ticks:{color:'#8a93a8',callback:v=>v+'%'}},x:{display:false}}}
      });

      let h = '';
      results.forEach(r => {
        if(r.trades.length){
          h += `<div class="stockblock"><h3>${r.code} ${r.name}</h3><table><thead><tr><th>买入日期</th><th>价格</th><th>卖出/当前</th><th>价格</th><th>收益%</th><th>状态</th></tr></thead><tbody>`;
          r.trades.forEach(t => { const pv = (t.sp/t.bp-1)*100; h += `<tr><td>${t.bd}</td><td>${t.bp.toFixed(2)}</td><td>${t.sd}</td><td>${t.sp.toFixed(2)}</td><td class="${pv>=0?'pos':'neg'}">${pv.toFixed(2)}%</td><td style="color:${t.status==='持仓中'?'#f0b429':'#8a93a8'}">${t.status}</td></tr>`; });
          h += `</tbody></table></div>`;
        }
      });
      document.getElementById('stockDetails').innerHTML = h || '无交易记录';
      log("回测成功", "ok");
    } catch(e) { log(e.message, "err"); } finally { btn.disabled = false; }
  };

  FavManager.render();
})();
</script>
</body>
</html>
